<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .card{
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 300px;
            padding: 20px;
            text-align: center;
        }

        .card img{
            max-width: 100%;
            border-radius: 8px 8px 0 0;
        }

        .card h2{
            font-size: 1.5rem;
            margin: 15px 0;
        }

        .card p{
            color: #667;
            font-size: 1em;
            line-height: 1.5;
            margin: 15px 0;
        }

        .card button{
            background-color: #007bff;
            border: none;
            color: #fff;
            padding: 10px 15px;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            transition:  background-color 0.3s ease;
        }

        .card button:hover{
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/gojo.jpg" alt="Imagen gojo" height="200" width="350">
        <h2>Titulo card</h2>
        <p>Breve texto descriptivo para la card, puede dar info extra sobre contenido</p>
        <button>Leer mas</button>
    </div>
</body>
</html>
