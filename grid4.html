<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: lightsalmon;
            border: 3px solid black;
            border-radius: 10px;
            display: grid;
            grid-auto-rows: 50px;
            grid-template-columns: repeat(3, 1fr);
            column-gap: 10px;
            row-gap: 20px;
            height: 400px;
            /* sobre el eje de cada uno, no sobre la disposicion general*/
            justify-items: center; /*normal por defecto. Start a la izquierda, end al final. En base a columnas. Stretch hace que ocupe todo.*/
            align-items: center; /* en base a filas*/
        }

        .container div{
            background: lightblue;
            border: 2px solid #09f;
            border-radius: 6px;
        }

        .container div:first-child{
            background: lightgreen;
            border: 2px solid green;
            /*justify-self:center lo acomoda a ese especifico*/
        }

        .container div:nth-child(2){
            background-color: red;
            border: 2px solid blue;
        }
    </style>
</head>
<body>

    <section class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>


    </section>
    
</body>
</html>
